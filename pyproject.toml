[project]
name = "texas-idrt-invasive-species-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "numpy>=2.5.5",
    "open-clip-torch>=4.2.2",
    "opencv-python>=5.1.0.95",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pyarrow>=26.0.1",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "sahi>=0.14.0",
    "scikit-learn>=1.9.1",
    "shapely>=2.2.0",
    "tabulate>=0.10.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "ultralytics>=8.4.215",
]

[project.scripts]
texas-idrt-invasive-species-detection = "texas_idrt_invasive_species_detection:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
